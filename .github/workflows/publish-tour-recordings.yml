name: Publish contractor walkthrough recordings

# The clips are generated against invented data and live in a private bucket.
# This job is how they get there: record from the live app, then upload with
# the service-role key (fetched via the existing SUPABASE_ACCESS_TOKEN, never
# stored in the repo).

on:
  push:
    branches: [main]
    paths:
      - "src/lib/tours/**"
      - "src/components/tour/**"
      - "scripts/tours/**"
      - "scripts/verify-contractor-tours.ts"
      - ".github/workflows/publish-tour-recordings.yml"
  workflow_dispatch: {}

jobs:
  record-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: sxdraeptzuamsgjcvfeg
      NEXT_PUBLIC_SUPABASE_URL: https://sxdraeptzuamsgjcvfeg.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4ZHJhZXB0enVhbXNnamN2ZmVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkzNzYzMzMsImV4cCI6MjA3NDk1MjMzM30.g7Ipg_qYJiC7uASufDsDqIMtRGPg_dJbSZClJCuAa5I
      NEXT_PUBLIC_SUPABASE_PROJECT_ID: sxdraeptzuamsgjcvfeg
      TOURS_RECORD_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Record the seven walkthroughs
        run: |
          npm run dev -- --port 3100 > /tmp/next-dev.log 2>&1 &
          echo $! > /tmp/next-dev.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3100/ >/dev/null; then
              echo "dev server ready"
              break
            fi
            sleep 5
          done
          curl -sf http://localhost:3100/ >/dev/null
          npm run tours:record
          kill "$(cat /tmp/next-dev.pid)" || true

      - name: Fetch the service-role key and publish
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is empty — same secret the edge-function deploy uses."
            exit 1
          fi
          KEYS=$(curl -sS "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
          export SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"
          export SUPABASE_SERVICE_ROLE_KEY
          SUPABASE_SERVICE_ROLE_KEY=$(node -e '
            const keys = JSON.parse(process.argv[1]);
            const list = Array.isArray(keys) ? keys : (keys.api_keys || keys.keys || []);
            const row = list.find((k) =>
              (k.name || k.id || k.tags || "").toString().includes("service_role")
              || (Array.isArray(k.tags) && k.tags.includes("service_role"))
            );
            const value = row && (row.api_key || row.key || row.apiKey);
            if (!value) {
              console.error("Could not find service_role in:", JSON.stringify(keys).slice(0, 400));
              process.exit(1);
            }
            process.stdout.write(value);
          ' "$KEYS")
          npm run tours:publish
