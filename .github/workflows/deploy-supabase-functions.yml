name: Deploy Supabase Edge Functions

# Why this exists:
# Edge functions were NOT auto-deploying — code merged to `main` (credit fix,
# cleaner-mark-complete, photo phases, payroll emails, etc.) never went live on
# Supabase, which surfaced as "edge function error" / 404s in production. This
# workflow deploys every function in supabase/functions/* straight from `main`
# using the Supabase CLI (which bundles each function's _shared deps correctly),
# so the deployed functions always match the repo.
#
# One-time setup: add a repository secret SUPABASE_ACCESS_TOKEN
#   (Supabase Dashboard → Account → Access Tokens → Generate new token).
# After that, every push to main that touches supabase/functions deploys
# automatically, and you can also trigger it manually from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Binding the job to the Production environment so the token resolves whether
    # it was stored as a repository secret OR a Production environment secret —
    # an environment secret is invisible to a job that declares no environment,
    # which is what kept this workflow failing with an empty token. Neither
    # environment carries protection rules, so this adds no approval gate.
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: sxdraeptzuamsgjcvfeg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Guard — require access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN resolved to an empty value. This job reads repository secrets and Production environment secrets. Check that the secret is stored in one of those scopes (not the Preview environment, not a Dependabot secret, and not an Actions *variable*), that the name matches exactly, and that it is on DivineAcquisition/novaracleaningui."
            exit 1
          fi
          echo "Access token present (${#SUPABASE_ACCESS_TOKEN} chars)."

      - name: Deploy all edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
