name: Delete sample onboarding contractor

# One-time cleanup of the contractor created by mistake while testing
# onboarding. Dispatch only. The script refuses any email except the
# plus-address used for that sample.

on:
  push:
    branches: [main]
    paths:
      - scripts/delete-sample-onboarding.py
      - .github/workflows/delete-sample-onboarding.yml

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: sxdraeptzuamsgjcvfeg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete the sample contractor
        run: python3 scripts/delete-sample-onboarding.py
