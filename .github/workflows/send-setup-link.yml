    paths:
      - scripts/send-setup-link.py
      - .github/workflows/send-setup-link.yml

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: sxdraeptzuamsgjcvfeg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update the email and text the link
        run: python3 scripts/send-setup-link.py
