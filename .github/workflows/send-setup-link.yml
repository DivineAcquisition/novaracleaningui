name: Send tokenized setup link

# One-time send of Malik's contractor setup link by email and SMS.

on:
  push:
    branches: [main]
    paths:
      - scripts/send-setup-link.py
      - .github/workflows/send-setup-link.yml

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: sxdraeptzuamsgjcvfeg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mint the link and send it
        run: python3 scripts/send-setup-link.py
