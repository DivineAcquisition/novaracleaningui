# ─── Auth posture pinned to what is live ──────────────────────────────────
#
# `supabase functions deploy` applies verify_jwt from THIS file, defaulting to
# true for anything undeclared. These functions are live with verify_jwt=false,
# so leaving them out would have flipped them to JWT-required on the first
# successful deploy — silently breaking the callers that legitimately arrive
# without a JWT (external webhooks, SMS/email link targets, cron invocations).
# Declaring them here keeps deploys faithful to the running configuration.
#
# NOTE for review: several admin-* functions below are publicly reachable and
# rely on their own in-handler authorization. That posture predates this file;
# it is recorded here as-is rather than changed as a side effect of a deploy.

